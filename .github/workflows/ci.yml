name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download sample data
        run: |
          python scripts/download_data.py --dataset german --create-sample --sample-size 500

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

      - name: Run integration test
        run: |
          python scripts/run_audit.py \
            --dataset german \
            --data-path data/sample_german_credit.csv \
            --sample-size 500 \
            --mitigation all \
            --out-dir reports/ci

      - name: Verify outputs exist
        run: |
          test -f reports/ci/metrics.csv
          test -f reports/ci/report.md
          echo "All expected outputs generated successfully"

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/ci/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check code with ruff
        run: |
          ruff check src/ scripts/ tests/

      - name: Check formatting with ruff
        run: |
          ruff format --check src/ scripts/ tests/
